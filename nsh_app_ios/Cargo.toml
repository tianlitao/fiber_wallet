[package]
name = "nsh-app-fiber-wallet-ios"
version = "0.1.0"
edition = "2024"
publish = false
description = "NSH (Native Shell) iOS shell for the Fiber wallet: bottom-tab UI over the shared wallet bridge, Keychain-backed secret password"

[workspace]

[dependencies]
fiber_wallet_core = { path = "../core" }
nsh-core = "0.2.0"
nsh-base = "0.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
security-framework = "3"

# The macOS shell owns the bridge, theme, widgets, and pages; the iOS shell
# reuses them and swaps the desktop sidebar for a bottom tab bar.
nsh-app-fiber-wallet-nsh = { path = "../nsh_app" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-ui-kit = { version = "0.3", features = [
    "UIButton",
    "UIControl",
    "UIColor",
    "UIFont",
    "UILabel",
    "UIApplication",
    "UIResponder",
    "UIView",
    "UIWindowScene",
    "UIViewController",
] }
objc2-av-foundation = { version = "0.3", features = [
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureMetadataOutput",
    "AVCaptureOutput",
    "AVCaptureSession",
    "AVCaptureVideoPreviewLayer",
    "AVFCapture",
    "AVMediaFormat",
    "AVMetadataObject",
] }
objc2-quartz-core = "0.3"
block2 = "0.6"
dispatch2 = "0.3"