[package]
name = "fiber_wallet_core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Framework-agnostic Rust core for the local-first Fiber wallet (NSH host)"

[lib]
crate-type = ["rlib"]

[dependencies]
flate2 = "1"
hex = "0.4"
rand = "0.8"
serde = "1"
serde_json = "1"
secp256k1 = { version = "0.30", features = ["rand", "global-context"] }
tar = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tentacle-secio = "=0.6.8"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bech32 = "0.9"
ckb-chain-spec = "1"
ckb-hash = "1"
ckb-jsonrpc-types = "1.2.1"
ckb-types = "1"
ckb-resource = "1"
ckb-sdk = "5"
fiber-json-types = { path = "../vendor/fiber/crates/fiber-json-types", features = ["all"] }
fs2 = "0.4"
fnn = { path = "../vendor/fiber/crates/fiber-lib", features = ["sqlite"] }
ractor = { version = "0.15", features = ["async-trait"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[build-dependencies]
cc = "1"
