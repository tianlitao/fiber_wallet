[package]
name = "nsh-app-fiber-wallet-nsh"
version = "0.1.0"
edition = "2024"
publish = false
description = "NSH (Native Shell) macOS shell for the Fiber wallet"

[workspace]

[dependencies]
nsh-core = "0.2.0"
nsh-base = "0.2.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
fiber_wallet_core = { path = "../core" }
fast_qr = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.2.0", default-features = false }

[dev-dependencies]
nsh-engine = "0.2"
nsh-testing = "0.2"
